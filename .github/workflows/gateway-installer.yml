name: Site Manager Installer

# Builds the WLM Site Manager Windows installer and publishes it to the
# `gateway-latest` GitHub Release. The installer bundles Node.js, cloudflared
# and the WinSW service wrapper; the client only types a site name (and an
# optional connection code for a permanent address).

on:
  push:
    branches: [ "claude/**", "main" ]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = "gateway/installer/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          # Site Manager app files
          Copy-Item gateway/server.js          $payload/
          Copy-Item gateway/package.json       $payload/
          Copy-Item gateway/config.example.json $payload/
          Copy-Item gateway/README.md          $payload/
          Copy-Item gateway/installer/wlm-gateway-service.xml $payload/
          Copy-Item "gateway/installer/WLM Site Manager.cmd"  $payload/
          Copy-Item gateway/installer/wlm.ico  $payload/

          # Node.js runtime (bundled so no prerequisite install is needed)
          $node = "v20.18.1"
          Invoke-WebRequest "https://nodejs.org/dist/$node/node-$node-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodetmp -Force
          Copy-Item "nodetmp/node-$node-win-x64/node.exe" "$payload/node.exe"

          # WinSW service wrapper (renamed to match the service XML)
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile "$payload/wlm-gateway-service.exe"

          # cloudflared
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$payload/cloudflared.exe"

          Get-ChildItem $payload | Format-Table Name,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" gateway/installer/wlm-gateway.iss
          Get-ChildItem gateway/installer/Output

      - name: Package source zip (for non-Windows sites)
        shell: pwsh
        run: |
          Compress-Archive -Path gateway/server.js,gateway/package.json,gateway/config.example.json,gateway/README.md -DestinationPath gateway/installer/Output/WLM-SiteManager-source.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wlm-sitemanager-setup
          path: gateway/installer/Output/WLM-SiteManager-Setup.exe
          if-no-files-found: error

      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: WLM Site Manager (Windows)
          tag_name: gateway-latest
          target_commitish: ${{ github.sha }}
          body: |
            **WLM Site Manager** — install at each client mining site.

            Run `WLM-SiteManager-Setup.exe` on an always-on Windows PC on the
            miners' LAN. It auto-discovers the miners, shows a live dashboard
            in its own desktop window, and links the site to the WLM ASIC
            Manager phone app.

            During install the client only types a **site name**. Paste a
            **connection code** (provided by WeLoveMining) for a permanent
            address, or leave it blank for a free auto-generated one (shown on
            the dashboard). Copy the **app access token** into the phone app.

            **Other OS:** `WLM-SiteManager-source.zip` — run `node server.js`.
          files: |
            gateway/installer/Output/WLM-SiteManager-Setup.exe
            gateway/installer/Output/WLM-SiteManager-source.zip
          fail_on_unmatched_files: true
