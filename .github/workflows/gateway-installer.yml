name: Gateway Installer

# Builds the WLM Gateway Windows installer and publishes it to the
# `gateway-latest` release. Bundles Node.js, cloudflared and the WinSW
# service wrapper.

on:
  push:
    branches: [ "claude/**", "main" ]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Gateway Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = "gateway/installer/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item gateway/server.js          $payload/
          Copy-Item gateway/package.json       $payload/
          Copy-Item gateway/config.example.json $payload/
          Copy-Item gateway/README.md          $payload/
          Copy-Item gateway/installer/wlm-gateway-service.xml $payload/
          Copy-Item "gateway/installer/WLM Site Manager.cmd"  $payload/
          Copy-Item gateway/installer/wlm.ico  $payload/

          $node = "v20.18.1"
          Invoke-WebRequest "https://nodejs.org/dist/$node/node-$node-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodetmp -Force
          Copy-Item "nodetmp/node-$node-win-x64/node.exe" "$payload/node.exe"

          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile "$payload/wlm-gateway-service.exe"
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$payload/cloudflared.exe"
          Get-ChildItem $payload | Format-Table Name,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" gateway/installer/wlm-gateway.iss
          Get-ChildItem gateway/installer/Output

      - name: Package source zip
        shell: pwsh
        run: Compress-Archive -Path gateway/server.js,gateway/package.json,gateway/config.example.json,gateway/README.md -DestinationPath gateway/installer/Output/WLM-Gateway-source.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wlm-gateway-setup
          path: gateway/installer/Output/WLM-Gateway-Setup.exe
          if-no-files-found: error

      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: WLM Gateway (Windows)
          tag_name: gateway-latest
          target_commitish: ${{ github.sha }}
          body: |
            **WLM Gateway** — the one program you install at each mining site.

            Run `WLM-Gateway-Setup.exe` on an always-on Windows PC on the
            miners' LAN. It auto-discovers the miners, shows a live dashboard,
            and creates a public address so the **WLM ASIC Manager** app can
            reach the site from anywhere.

            During install: type a **site name** (and optionally a Cloudflare
            connection code for a permanent address). Then open the dashboard —
            it shows the **App address + token** to paste into the app under
            Settings → My Sites.

            **Other OS:** `WLM-Gateway-source.zip` — run `node server.js`.
          files: |
            gateway/installer/Output/WLM-Gateway-Setup.exe
            gateway/installer/Output/WLM-Gateway-source.zip
          fail_on_unmatched_files: true
