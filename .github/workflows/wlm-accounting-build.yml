name: WLM Accounting — Android APK

on:
  push:
    branches: [main]
    paths:
      - "wlm-accounting/**"
      - ".github/workflows/wlm-accounting-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wlm-accounting

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wlm-accounting/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate a one-time release keystore
        working-directory: wlm-accounting/android
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias wlm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wlmaccounting \
            -keypass wlmaccounting \
            -dname "CN=WeLoveMining, OU=App, O=WeLoveMining, L=Johannesburg, S=GP, C=ZA"

      - name: Inject signing config into Gradle
        working-directory: wlm-accounting/android
        run: |
          cat >> app/build.gradle << 'GRADLE'

          android.signingConfigs {
            release {
              storeFile file("../release.keystore")
              storePassword "wlmaccounting"
              keyAlias "wlm"
              keyPassword "wlmaccounting"
            }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

      - name: Build release APK
        working-directory: wlm-accounting/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLM-Accounting-${{ github.run_number }}.apk
          path: wlm-accounting/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
