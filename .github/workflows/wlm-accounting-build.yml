name: WLM Accounting — Android APK

on:
  push:
    branches: [main]
    paths:
      - "wlm-accounting/**"
      - ".github/workflows/wlm-accounting-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wlm-accounting

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test the accounting engine
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate a one-time release keystore
        working-directory: wlm-accounting/android
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias wlm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wlmaccounting \
            -keypass wlmaccounting \
            -dname "CN=WeLoveMining, OU=App, O=WeLoveMining, L=Johannesburg, S=GP, C=ZA"

      - name: Inject signing config into Gradle
        working-directory: wlm-accounting/android
        run: |
          cat >> app/build.gradle << 'GRADLE'

          android.signingConfigs {
            release {
              storeFile file("../release.keystore")
              storePassword "wlmaccounting"
              keyAlias "wlm"
              keyPassword "wlmaccounting"
            }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

      - name: Build release APK
        working-directory: wlm-accounting/android
        # The runner sometimes fetches a truncated Android NDK archive, which
        # fails the whole build ~2 minutes in with "Archive is not a ZIP
        # archive". Retrying costs a couple of minutes; losing a 25-minute
        # build to a bad download costs a lot more.
        run: |
          for attempt in 1 2; do
            if ./gradlew assembleRelease --no-daemon; then
              exit 0
            fi
            echo "::warning::Gradle attempt $attempt failed; retrying once."
            rm -rf "$ANDROID_SDK_ROOT/ndk/27.1.12297006" 2>/dev/null || true
            sleep 15
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLM-Accounting-${{ github.run_number }}.apk
          path: wlm-accounting/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
