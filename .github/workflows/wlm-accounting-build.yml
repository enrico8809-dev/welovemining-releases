name: WLM Accounting — Android APK

on:
  push:
    branches: [main]
    paths:
      - "wlm-accounting/**"
      - ".github/workflows/wlm-accounting-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wlm-accounting

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test the accounting engine
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate a one-time release keystore
        working-directory: wlm-accounting/android
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias wlm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wlmaccounting \
            -keypass wlmaccounting \
            -dname "CN=WeLoveMining, OU=App, O=WeLoveMining, L=Johannesburg, S=GP, C=ZA"

      - name: Inject signing config into Gradle
        working-directory: wlm-accounting/android
        run: |
          cat >> app/build.gradle << 'GRADLE'

          android.signingConfigs {
            release {
              storeFile file("../release.keystore")
              storePassword "wlmaccounting"
              keyAlias "wlm"
              keyPassword "wlmaccounting"
            }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

      - name: Build release APK
        working-directory: wlm-accounting/android
        # arm64-v8a only. React Native defaults to building all four ABIs into
        # one APK, which tripled the download for slices no modern phone uses.
        # The RN Gradle plugin feeds this property straight into ndk.abiFilters.
        #
        # The runner sometimes fetches a truncated Android NDK archive, which
        # fails the whole build ~2 minutes in with "Archive is not a ZIP
        # archive". Retrying costs a couple of minutes; losing a 25-minute
        # build to a bad download costs a lot more.
        run: |
          for attempt in 1 2; do
            if ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon; then
              exit 0
            fi
            echo "::warning::Gradle attempt $attempt failed; retrying once."
            rm -rf "$ANDROID_SDK_ROOT/ndk/27.1.12297006" 2>/dev/null || true
            sleep 15
          done
          exit 1

      - name: Stage APK under a stable name
        working-directory: wlm-accounting
        run: cp android/app/build/outputs/apk/release/app-release.apk WLM-Accounting-latest.apk

      - name: Read the app version
        id: version
        working-directory: wlm-accounting
        run: echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # One download, one name, one link. The per-run artifact this used to keep
      # alongside the release was how a months-old build got installed by
      # mistake, and no version was visible to tell them apart — so the build is
      # published in exactly one place and the release says which version it is.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: WLM Accounting v${{ steps.version.outputs.v }}
          tag_name: accounting-latest
          target_commitish: ${{ github.sha }}
          body: |
            **WLM Accounting v${{ steps.version.outputs.v }}** — double-entry books
            for WeLoveMining.

            Ledger and reports · bank import (FNB CSV/OFX) · invoices and quotes ·
            stock with landed cost · reconciliation · PDF export · optional cloud
            sync over your own Cloudflare Tunnel.

            Download `WLM-Accounting-latest.apk` on your phone and tap it to
            install (allow "install from unknown sources" if prompted). Settings
            shows the version once it's installed — it should read
            ${{ steps.version.outputs.v }}.
          files: wlm-accounting/WLM-Accounting-latest.apk
          fail_on_unmatched_files: true
