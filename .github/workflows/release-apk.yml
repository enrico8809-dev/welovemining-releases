name: Release APK

# Publishes an installable APK as a GitHub Release asset so it can be
# downloaded straight to a phone. Trigger by pushing a tag like `app-v1.0.0`,
# or run manually from the Actions tab.

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/WLM-ASIC-Manager-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WLM ASIC Manager ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            WLM ASIC Manager Android app — sideload build.

            **Install on your phone:** open this page on the phone, download the
            `.apk` below, then tap it (allow "install from unknown sources" if
            prompted). Demo mode is on by default; turn it off in Settings to
            connect to real miners.

            > Debug-signed for easy sideloading (not a Play Store build).
          files: dist/*.apk
          fail_on_unmatched_files: true
