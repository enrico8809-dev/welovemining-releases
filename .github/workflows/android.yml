name: Android CI

on:
  push:
    branches: [ "claude/**", "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wlm-asic-manager-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish an installable APK to a GitHub Release so it can be downloaded
      # straight to a phone. Runs only on branch pushes (not PRs).
      - name: Stage APK for release
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/WLM-ASIC-Manager-latest.apk

      - name: Publish Release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: WLM ASIC Manager (latest debug build)
          tag_name: app-latest
          target_commitish: ${{ github.sha }}
          body: |
            Latest WLM ASIC Manager Android build for sideloading.

            **Install on your phone:** open this page on the phone, download the
            `.apk` below and tap it (allow "install from unknown sources" if
            prompted). Demo mode is on by default — turn it off in Settings to
            connect to real miners. Debug-signed (not a Play Store build).
          files: dist/WLM-ASIC-Manager-latest.apk
          fail_on_unmatched_files: true
