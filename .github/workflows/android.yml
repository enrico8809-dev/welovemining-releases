name: Android CI

on:
  push:
    branches: [ "claude/**", "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wlm-asic-manager-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish an installable APK to a GitHub Release so it can be downloaded
      # straight to a phone. Runs only on branch pushes (not PRs).
      - name: Stage APK + gateway for release
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/WLM-ASIC-Manager-latest.apk"
          cd "$GITHUB_WORKSPACE"
          zip -r dist/WLM-Gateway.zip gateway -x 'gateway/node_modules/*' 'gateway/config.json' 'gateway/windows/node_modules/*'

      - name: Publish Release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: WLM ASIC Manager (latest debug build)
          tag_name: app-latest
          target_commitish: ${{ github.sha }}
          body: |
            Latest WLM ASIC Manager build.

            **App (phone):** download `WLM-ASIC-Manager-latest.apk` below, tap it
            (allow "install from unknown sources"). Demo mode is on by default —
            turn it off in Settings to connect to real miners. Debug-signed.

            **Site gateway:** download `WLM-Gateway.zip` and run it on an
            always-on PC at each site (see `gateway/README.md` inside). Exposes
            one API over a Cloudflare tunnel so the app reaches that site
            remotely.
          files: |
            dist/WLM-ASIC-Manager-latest.apk
            dist/WLM-Gateway.zip
          fail_on_unmatched_files: true
