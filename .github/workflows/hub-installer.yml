name: Hub Installer

# Builds the WLM Hub Windows installer and publishes it to the `hub-latest`
# release. Bundles Node.js, cloudflared (for the Hub's single public address)
# and the WinSW service wrapper.

on:
  push:
    branches: [ "claude/**", "main" ]
    paths:
      - "hub/**"
      - ".github/workflows/hub-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Hub Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = "hub/installer/payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item hub/server.js           $payload/
          Copy-Item hub/package.json        $payload/
          Copy-Item hub/config.example.json $payload/
          Copy-Item hub/README.md           $payload/
          Copy-Item hub/installer/wlm-hub-service.xml $payload/
          Copy-Item "hub/installer/WLM Hub.cmd"       $payload/
          Copy-Item hub/installer/wlm.ico   $payload/

          $node = "v20.18.1"
          Invoke-WebRequest "https://nodejs.org/dist/$node/node-$node-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodetmp -Force
          Copy-Item "nodetmp/node-$node-win-x64/node.exe" "$payload/node.exe"

          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile "$payload/wlm-hub-service.exe"
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$payload/cloudflared.exe"
          Get-ChildItem $payload | Format-Table Name,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" hub/installer/wlm-hub.iss
          Get-ChildItem hub/installer/Output

      - name: Package source zip
        shell: pwsh
        run: Compress-Archive -Path hub/server.js,hub/package.json,hub/config.example.json,hub/README.md -DestinationPath hub/installer/Output/WLM-Hub-source.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wlm-hub-setup
          path: hub/installer/Output/WLM-Hub-Setup.exe
          if-no-files-found: error

      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: WLM Hub (Windows)
          tag_name: hub-latest
          target_commitish: ${{ github.sha }}
          body: |
            **WLM Hub** — install once, on an always-on PC at your office.

            Run `WLM-Hub-Setup.exe`. It installs the Hub as a service and (if you
            paste a Cloudflare connection code) opens one public address for the
            whole system — e.g. https://manage.welovemining.co.za. Copy the
            **operator token** into the app and the Hub dashboard.

            Every site's WLM Site Agent then dials in to this Hub and appears
            automatically. **Other OS:** `WLM-Hub-source.zip` — run `node server.js`.
          files: |
            hub/installer/Output/WLM-Hub-Setup.exe
            hub/installer/Output/WLM-Hub-source.zip
          fail_on_unmatched_files: true
